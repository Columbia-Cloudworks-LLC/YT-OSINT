name: Windows PowerShell tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          Install-Module ImportExcel -RequiredVersion 7.8.10 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Parse PowerShell source
        shell: powershell
        run: |
          $errorsFound = @()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errorsFound += $parseErrors
          }
          if ($errorsFound.Count) { $errorsFound | Format-List; exit 1 }
      - name: Test offline fixtures
        shell: powershell
        run: .\tests\Run-Tests.ps1
